<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rebuild XI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Anton&family=Barlow+Condensed:wght@500;600;700;800&display=swap');
:root{--bg:#000;--panel:#0b0b0b;--line:#222;--text:#fff;--muted:#8a8a8a;--accent:#d4ff3a;--money:#3affa0;--mgmt:#5aa8ff;--bad:#ff5a5a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;color:#fff;font-family:Inter,system-ui,sans-serif;overflow:hidden}
button{font-family:inherit;cursor:pointer}
.screen{display:none;position:fixed;inset:0}
.screen.on{display:flex}
.btn{background:#fff;color:#000;border:0;padding:15px 34px;border-radius:999px;font-weight:700;font-size:14px;letter-spacing:.06em;transition:transform .15s,opacity .15s}
.btn:hover{transform:scale(1.04)}
.btn:disabled{opacity:.3;cursor:not-allowed;transform:none}
.btn.ghost{background:rgba(0,0,0,.5);color:#fff;border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(6px)}
.btn.acc{background:var(--accent)}
.kicker{letter-spacing:.3em;font-size:11px;color:var(--muted);font-weight:500}

/* HOME */
#home{background:url(hero.jpg) center/cover no-repeat;flex-direction:column;justify-content:flex-end;padding:0 6vw 8vh}
#home::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,.55) 38%,rgba(0,0,0,0) 65%),linear-gradient(0deg,#000 0%,rgba(0,0,0,0) 45%)}
#home>*{position:relative}
.brand{position:absolute!important;top:26px;left:6vw;font-family:Anton,sans-serif;font-size:24px;letter-spacing:.02em}
.brand span,.logo span{color:var(--accent)}
.h-kick{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:.28em;color:var(--accent);text-transform:uppercase}
.hero-t{font-family:Anton,sans-serif;font-size:clamp(56px,8.5vw,124px);line-height:.9;text-transform:uppercase;margin:10px 0 16px;letter-spacing:.005em}
.hero-s{font-family:'Barlow Condensed',sans-serif;font-weight:500;color:#c9c9c9;max-width:440px;line-height:1.35;font-size:19px;margin-bottom:26px}
.today{display:flex;align-items:stretch;margin-bottom:26px;width:max-content;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase}
.today .lbl{background:var(--accent);color:#000;font-weight:800;font-size:14px;letter-spacing:.14em;padding:8px 14px;display:flex;align-items:center;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.today .val{background:#fff;color:#000;padding:8px 20px 8px 16px;margin-left:-6px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);display:flex;align-items:baseline;gap:10px}
.today .val b{font-weight:800;font-size:22px;letter-spacing:.02em}
.today .val small{font-weight:600;font-size:14px;color:#555;letter-spacing:.06em}
.home-btns{display:flex;gap:14px;align-items:center}
.gbtn{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;font-size:22px;letter-spacing:.06em;border:0;padding:14px 34px 13px;
  clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);transition:transform .12s,filter .12s;display:flex;align-items:center;gap:12px}
.gbtn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.gbtn:active{transform:translateY(1px)}
.gbtn.p{background:var(--accent);color:#000;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.gbtn.p .ar{font-size:18px}
.gbtn.s{background:rgba(255,255,255,.08);color:#fff;font-size:18px;padding:12px 28px 11px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);backdrop-filter:blur(6px)}
.gbtn.s:hover{background:rgba(255,255,255,.18)}

/* CALENDAR */
#archive{flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at top,#111,#000 60%);padding:24px}
.cal{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}
.cal h2{font-size:24px;font-weight:900;margin:8px 0 18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.grid .h{font-size:10px;color:var(--muted);text-align:center;letter-spacing:.1em;padding-bottom:4px}
.day{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:#444}
.day.has{color:#fff;cursor:pointer;background:#111}
.day.has:hover{border-color:#fff}
.day.today{border-color:var(--accent)}
.day.done::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:3px}
.day.lock{cursor:not-allowed;opacity:.5}
.cal-note{color:var(--muted);font-size:12px;margin-top:16px;line-height:1.5}
.cal-info{margin-top:14px;font-size:14px;min-height:20px}

/* SHARED GAME TYPE */
.cond{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase}
.disp{font-family:Anton,sans-serif;text-transform:uppercase;letter-spacing:.01em}
.topbar{position:absolute;top:0;left:0;right:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:18px 28px;border-bottom:1px solid var(--line);background:#000;z-index:2}
.logo{font-family:Anton,sans-serif;font-size:20px;cursor:pointer;letter-spacing:.02em}
.club{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:600;letter-spacing:.12em;color:var(--muted);font-size:14px;text-align:right}
.club b{color:#fff}
.bud{text-align:center}
.bud small{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.3em;font-size:11px;color:var(--muted)}
.bud div{font-family:Anton,sans-serif;font-size:34px;color:var(--money);line-height:1.1}
.bud div.flash{animation:flash .6s}
@keyframes flash{30%{transform:scale(1.15)}}
.gbtn.k{background:#fff;color:#000;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.gbtn.r{background:var(--bad);color:#000;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.gbtn:disabled{opacity:.3;cursor:not-allowed;transform:none;filter:none}

/* MANAGER SCREEN */
#mgrScr{background:#000;flex-direction:column;align-items:center;justify-content:center;padding:100px 30px 40px}
.mstage{width:min(1100px,100%);display:flex;flex-direction:column;align-items:center;gap:34px}
.mlabel{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.3em;color:var(--accent);font-size:14px;text-transform:uppercase}
.mcur{display:flex;align-items:center;gap:44px;width:100%;justify-content:center}
.mcard{width:300px;border:1px solid #2a2a2a;border-radius:4px;padding:28px;background:linear-gradient(160deg,#111,#050505);position:relative}
.mcard .ovr{font-family:Anton,sans-serif;font-size:72px;line-height:1}
.mcard .role{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.2em;color:var(--muted);font-size:13px;margin-top:2px}
.mcard .nm{font-family:Anton,sans-serif;font-size:34px;text-transform:uppercase;line-height:1;margin:26px 0 10px}
.mcard .worth{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:18px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mcard .worth b{color:var(--money)}
.mcard.sold{opacity:.35}
.mcard.sold::after{content:"SOLD";position:absolute;top:24px;right:-10px;background:var(--bad);color:#000;font-family:Anton,sans-serif;font-size:22px;padding:4px 16px;transform:rotate(8deg)}
.mact{display:flex;flex-direction:column;gap:14px}
.mopts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%}
.mo{border:1px solid #2a2a2a;border-radius:4px;padding:24px;background:#0a0a0a;cursor:pointer;transition:all .18s;opacity:0;transform:translateY(20px);animation:up .45s forwards;text-align:left;color:#fff}
.mo:nth-child(2){animation-delay:.08s}.mo:nth-child(3){animation-delay:.16s}
@keyframes up{to{opacity:1;transform:none}}
.mo:hover{border-color:var(--accent);background:#111}
.mo.no{opacity:.3!important;cursor:not-allowed}
.mo .tier{font-family:'Barlow Condensed',sans-serif;font-weight:800;letter-spacing:.22em;font-size:12px;color:var(--muted)}
.mo .ovr{font-family:Anton,sans-serif;font-size:48px;line-height:1;margin-top:14px}
.mo .nm{font-family:Anton,sans-serif;font-size:26px;text-transform:uppercase;line-height:1.05;margin:10px 0 4px}
.mo .from{font-family:'Barlow Condensed',sans-serif;font-size:15px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.mo .price{font-family:Anton,sans-serif;font-size:26px;color:var(--money);margin-top:18px}

/* LINEUP SCREEN */
#game{background:#000}
.gbody{position:absolute;top:79px;left:0;right:0;bottom:0;display:flex}
.field{flex:1;display:flex;align-items:center;justify-content:center;padding:22px;min-width:0}
.pitch{position:relative;height:100%;aspect-ratio:68/100;max-width:100%;border-radius:6px;overflow:hidden;
 background:repeating-linear-gradient(0deg,#0b2414 0 10%,#0d2b18 10% 20%);border:2px solid rgba(255,255,255,.22)}
.ln{position:absolute;border:2px solid rgba(255,255,255,.22)}
.half{left:0;right:0;top:50%;border-width:2px 0 0 0!important}
.circ{width:26%;aspect-ratio:1;border-radius:50%;left:37%;top:50%;transform:translateY(-50%)}
.bb{left:22%;right:22%;bottom:-2px;height:16%}.bt{left:22%;right:22%;top:-2px;height:16%}
.slot{position:absolute;transform:translate(-50%,-50%);width:110px;text-align:center;animation:pop .4s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.3);opacity:0}}
.disc{width:52px;height:52px;border-radius:50%;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;font-family:Anton,sans-serif;font-size:20px;border:2px solid #fff;background:#000}
.slot.new .disc{border-color:var(--accent);color:var(--accent)}
.slot.bench .disc{border-color:#888}
.slot .nm{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;font-size:14px;background:rgba(0,0,0,.8);padding:2px 7px;display:inline-block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.03em}

.panel{width:420px;border-left:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:16px;overflow:auto}
.prow{display:flex;gap:12px}
.mini{flex:1;border:1px solid var(--line);border-radius:4px;padding:12px 14px}
.mini small{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.2em;color:var(--muted);font-size:11px}
.mini b{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;font-size:18px}
.mini .o{font-family:Anton,sans-serif;font-size:18px;float:right}
.cardslot{border:1px dashed #333;border-radius:4px;padding:14px;min-height:96px}
.cardslot.has{border:1px solid var(--mgmt);background:linear-gradient(160deg,#07121f,#000)}
.cardslot .t{font-family:'Barlow Condensed',sans-serif;font-weight:800;letter-spacing:.22em;color:var(--mgmt);font-size:11px}
.cardslot h4{font-family:Anton,sans-serif;font-size:24px;text-transform:uppercase;margin:6px 0 4px}
.cardslot p{color:var(--muted);font-size:13px;line-height:1.4}
.cardslot .empty{color:#444;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.2em;font-size:12px;height:66px;display:flex;align-items:center;justify-content:center}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.center .gbtn{justify-content:center}
.poslbl{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.3em;color:var(--muted);font-size:12px}
.posname{font-family:Anton,sans-serif;font-size:56px;line-height:.95;text-transform:uppercase;animation:up .4s forwards}
.pcard{width:100%;border:1px solid #2a2a2a;border-radius:4px;padding:18px 20px;display:flex;align-items:center;gap:16px;background:linear-gradient(160deg,#111,#050505);text-align:left}
.pcard .o{font-family:Anton,sans-serif;font-size:44px;line-height:1}
.pcard .i{flex:1}
.pcard .i b{display:block;font-family:Anton,sans-serif;font-size:24px;text-transform:uppercase;line-height:1.05}
.pcard .i small{font-family:'Barlow Condensed',sans-serif;font-weight:600;color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.06em}
.pcard .v{font-family:Anton,sans-serif;font-size:22px;color:var(--money)}
.kbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.kbtns .gbtn{justify-content:center;font-size:20px}
.opts{display:flex;flex-direction:column;gap:10px;width:100%}
.opt{display:flex;align-items:center;gap:14px;border:1px solid #2a2a2a;border-radius:4px;padding:12px 16px;background:#0a0a0a;cursor:pointer;text-align:left;color:#fff;opacity:0;transform:translateX(20px);animation:upx .4s forwards;transition:border-color .15s,background .15s}
.opt:nth-child(2){animation-delay:.07s}.opt:nth-child(3){animation-delay:.14s}.opt:nth-child(4){animation-delay:.21s}
@keyframes upx{to{opacity:1;transform:none}}
.opt:hover{border-color:var(--accent);background:#111}
.opt.no{opacity:.3!important;cursor:not-allowed}
.opt .o{font-family:Anton,sans-serif;font-size:30px;width:44px}
.opt .i{flex:1}
.opt .i small{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:800;letter-spacing:.2em;font-size:10px;color:var(--muted)}
.opt .i b{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;text-transform:uppercase;line-height:1.1}
.opt .i span{font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.opt .p{font-family:Anton,sans-serif;font-size:20px;color:var(--money)}
.opt.bench{border-style:dashed}
.opt.bench .p{color:#fff}
.opt{flex-direction:column;align-items:stretch;gap:0}
.optrow{display:flex;align-items:center;gap:14px}
.statsToggle{align-self:flex-start;margin-top:10px;background:none;border:0;color:var(--mgmt);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:0}
.stats{display:none;margin-top:8px;padding-top:8px;border-top:1px solid #222;font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stats.open{display:block}
.goalp{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:.08em;color:var(--mgmt);margin-top:6px;text-transform:uppercase}
.goalp.done{color:var(--money)}
.potbadge{color:var(--money)}
.prog{display:flex;gap:4px}
.prog i{flex:1;height:3px;background:#222}.prog i.d{background:#fff}.prog i.c{background:var(--accent)}

/* CARD TABLE */
.table{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;padding:16px;overflow:auto}
.table.on{display:flex}
.table h2{font-family:Anton,sans-serif;text-transform:uppercase;font-size:clamp(22px,4vw,48px);margin:6px 0 clamp(12px,3vh,34px);text-align:center}
.deck{display:flex;gap:clamp(8px,1.5vw,20px);flex-wrap:nowrap;justify-content:center}
.fc{--w:min(200px,21vw,30vh);width:var(--w);height:calc(var(--w)*1.43);perspective:1000px;flex:none}
.fc-in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.2,.8,.2,1),translate .2s;transform-style:preserve-3d;cursor:pointer}
.fc.ready:not(.flipped):not(.dim) .fc-in:hover{translate:0 -14px}
.fc.flipped .fc-in{transform:rotateY(180deg);cursor:default}
.fc.dim{filter:brightness(.35)}
.fc.chosen .front{border-color:var(--accent);box-shadow:0 0 34px rgba(212,255,58,.3)}
.face{position:absolute;inset:0;border-radius:6px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;border:1px solid #333;text-align:center}
.back{background:repeating-linear-gradient(45deg,#0b0b0b 0 10px,#121212 10px 20px)}
.back .em{font-family:Anton,sans-serif;font-size:44px;color:#2c2c2c;border:2px solid #262626;padding:6px 14px}
.back .tag{position:absolute;bottom:18px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:.3em;color:#555}
.front{background:#000;transform:rotateY(180deg);transition:border-color .3s,box-shadow .3s}
.front .type{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:11px;letter-spacing:.3em;color:var(--mgmt);margin-bottom:16px}
.front h3{font-family:Anton,sans-serif;text-transform:uppercase;font-size:calc(var(--w)*.13);line-height:1.02}
.front p{color:var(--muted);font-size:max(10px,calc(var(--w)*.065));margin-top:10px;line-height:1.4}
.front.goal{background:linear-gradient(160deg,#0a1420,#000);box-shadow:inset 0 0 40px rgba(90,168,255,.08)}
.front.goal .type{color:var(--mgmt)}
.front.pos{background:linear-gradient(160deg,#0a1f14,#000);box-shadow:inset 0 0 40px rgba(58,255,160,.08)}
.front.pos .type{color:var(--money)}
.front.neg{background:linear-gradient(160deg,#200a0a,#000);box-shadow:inset 0 0 40px rgba(255,90,90,.1)}
.front.neg .type{color:var(--bad)}
.camt{font-family:Anton,sans-serif;font-size:calc(var(--w)*.17);margin-bottom:4px}
.camt.pos{color:var(--money)}
.camt.neg{color:var(--bad)}
.cardslot.pos{border-color:var(--money);background:linear-gradient(160deg,#071f12,#000)}
.cardslot.neg{border-color:var(--bad);background:linear-gradient(160deg,#1f0707,#000)}
.cardslot.pos .t{color:var(--money)}
.cardslot.neg .t{color:var(--bad)}
.cardslot .camt{font-size:26px;margin-top:6px}
#tableBtn{margin-top:clamp(14px,3vh,36px);visibility:hidden;flex:none}

/* END */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
.ov.on{display:flex}
.end{text-align:center;display:flex;flex-direction:column;align-items:center}
.end .big{font-family:Anton,sans-serif;font-size:clamp(100px,16vw,180px);line-height:1}
.grade{font-family:'Barlow Condensed',sans-serif;font-weight:800;letter-spacing:.2em;font-size:16px;background:var(--accent);color:#000;padding:6px 16px;margin:10px 0 18px;text-transform:uppercase}
.cmp{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:18px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:28px}.cmp b{color:#fff}

@media (max-width:900px){.panel{width:340px}.slot{width:86px}.disc{width:42px;height:42px;font-size:16px}.mopts{grid-template-columns:1fr}.mcur{flex-direction:column;gap:20px}}
</style>
</head>
<body>

<!-- HOME -->
<section id="home" class="screen on">
  <div class="brand">REBUILD<span>XI</span></div>
  <div class="h-kick">Challenge of the day</div>
  <div class="hero-t">Who do<br>we pick?</div>
  <p class="hero-s">Take over a club. Sell who you don't want, draw management cards, spend the budget, and rebuild the starting XI.</p>
  <div class="today"><div class="lbl">Today</div><div class="val"><b id="todayClub"></b><small id="todayDate"></small></div></div>
  <div class="home-btns">
    <button class="gbtn p" onclick="startChallenge(TODAY)">Start daily challenge <span class="ar">▶</span></button>
    <button class="gbtn s" onclick="openArchive()">Past challenges</button>
  </div>
</section>

<!-- ARCHIVE -->
<section id="archive" class="screen">
  <div class="cal">
    <div style="display:flex;justify-content:space-between;align-items:center"><div class="kicker">ARCHIVE</div><button class="x" onclick="goHome()">×</button></div>
    <h2 id="calTitle"></h2>
    <div class="grid" id="calGrid"></div>
    <div class="cal-info" id="calInfo"></div>
    <p class="cal-note" id="calNote"></p>
  </div>
</section>

<!-- MANAGER SCREEN -->
<section id="mgrScr" class="screen">
  <div class="topbar">
    <div class="logo" onclick="goHome()">REBUILD<span>XI</span></div>
    <div class="bud"><small>TOTAL BUDGET</small><div class="budv">£0M</div></div>
    <div class="club">Rebuilding <b class="clubn"></b></div>
  </div>
  <div class="mstage" id="mstage"></div>
</section>

<!-- LINEUP SCREEN -->
<section id="game" class="screen">
  <div class="topbar">
    <div class="logo" onclick="goHome()">REBUILD<span>XI</span></div>
    <div class="bud"><small>BUDGET</small><div class="budv">£0M</div></div>
    <div class="club">Rebuilding <b class="clubn"></b></div>
  </div>
  <div class="gbody">
    <div class="field"><div class="pitch" id="pitch">
      <div class="ln half"></div><div class="ln circ"></div><div class="ln bb"></div><div class="ln bt"></div>
    </div></div>
    <aside class="panel" id="panel"></aside>
  </div>
</section>

<!-- CARD TABLE -->
<div class="table" id="table">
  <div class="kicker cond" id="tableKick" style="font-weight:700"></div>

    const k=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`,c=CHALLENGES[k];
    const locked=c&&k!==TODAY&&!todayDone;
    h+=`<div class="day ${c?"has":""} ${k===TODAY?"today":""} ${done[k]?"done":""} ${locked?"lock":""}" ${c?`onclick="calClick('${k}',${locked})"`:""}>${d}</div>`;
  }
  $("calGrid").innerHTML=h;$("calInfo").textContent="";
  $("calNote").textContent=todayDone?"Pick any past day to replay it.":"Finish today's challenge to unlock past days.";
}
function calClick(k,locked){
  if(locked){$("calInfo").innerHTML=`<b>${CHALLENGES[k].club}</b> · locked until today's challenge is done`;return}
  startChallenge(k);
}

/* ---------- STATE ---------- */
let S;
function setBudget(v){
  S.budget=Math.max(0,Math.round(v));
  document.querySelectorAll(".budv").forEach(e=>{e.textContent=`£${S.budget}M`;e.classList.remove("flash");void e.offsetWidth;e.classList.add("flash")});
}
function startChallenge(key){
  const c=CHALLENGES[key];
  S={key,c,budget:START_BUDGET,mgr:{...c.manager,orig:true},mgrSold:false,team:Array(11).fill(null),step:0,card:null,cardIdx:0,stage:"needCard",log:[],usedCards:[]};
  document.querySelectorAll(".clubn").forEach(e=>e.textContent=c.club);
  setBudget(START_BUDGET);
  show("mgrScr");renderMgr();
}

/* ---------- MANAGER SCREEN ---------- */
function renderMgr(){
  const c=S.c,m=c.manager;
  let h=`<div class="mlabel">Step 1 · The Manager</div>
   <div class="mcur"><div class="mcard ${S.mgrSold?"sold":""}"><div class="ovr">${m.ovr}</div><div class="role">CURRENT MANAGER</div>
     <div class="nm">${m.name}</div><div class="worth">Sell value <b>£${m.val}M</b></div></div>`;
  if(!S.mgrSold){
    h+=`<div class="mact"><button class="gbtn k" onclick="keepMgr()">Keep him</button><button class="gbtn r" onclick="sellMgr()">Sell · +£${m.val}M</button></div></div>`;
  }else{
    h+=`</div><div class="mlabel" style="color:#fff">Pick his replacement</div><div class="mopts">`+
      c.mgrOptions.map((o,i)=>{const ok=o[2]<=S.budget;return `<button class="mo ${ok?"":"no"}" ${ok?`onclick="hireMgr(${i})"`:""}>
        <div class="tier">${["BUDGET","MID","TOP"][i]} OPTION</div><div class="ovr">${o[1]}</div><div class="nm">${o[0]}</div><div class="from">${o[3]}</div><div class="price">£${o[2]}M</div></button>`}).join("")+`</div>`;
  }
  $("mstage").innerHTML=h;
}
function keepMgr(){toLineup()}
function sellMgr(){S.mgrSold=true;setBudget(S.budget+S.c.manager.val);renderMgr()}
function hireMgr(i){const o=S.c.mgrOptions[i];S.mgr={name:o[0],ovr:o[1],val:o[2],orig:false};setBudget(S.budget-o[2]);setTimeout(toLineup,250)}
function toLineup(){show("game");renderPitch();renderPanel()}

/* ---------- LINEUP ---------- */
function renderPitch(){
  document.querySelectorAll(".slot").forEach(e=>e.remove());
  SLOTS.forEach((s,i)=>{
    const p=S.team[i];if(!p)return;
    const d=document.createElement("div");
    d.className="slot "+(p.kind==="new"?"new":p.kind==="bench"?"bench":"");
    d.style.left=s.x+"%";d.style.top=s.y+"%";
    d.innerHTML=`<div class="disc">${p.ovr}</div><div class="nm">${p.name}</div>`;
    $("pitch").appendChild(d);
  });
}
function renderPanel(){
  const card=S.card;
  let h=`<div class="prow">
     <div class="mini"><small>MANAGER</small><b>${S.mgr.name}</b><span class="o">${S.mgr.ovr}</span></div>
   </div>
   <div class="cardslot ${card?"has "+(card.goal?"goal":(card.amt<0?"neg":"pos")):""}">${card?`<div class="t">${card.tag}</div><h4>${card.t}</h4><p>${card.d}</p>${card.amt?`<div class="camt ${card.amt<0?"neg":"pos"}">${card.amt<0?"−":"+"}£${Math.abs(card.amt)}M</div>`:""}${card.goal?`<div class="goalp ${S.goalDone?"done":""}">${S.goalDone?"✓ Mandate complete (+£15M)":goalLabel(card.goal)}</div>`:""}`:`<div class="empty">NO CARD YET</div>`}</div>
   <div class="prog">${ORDER.map((_,i)=>`<i class="${i<S.step?"d":i===S.step?"c":""}"></i>`).join("")}</div>
   <div class="center" id="center"></div>`;
  $("panel").innerHTML=h;
  const c=$("center");
  if(S.stage==="needCard"){
    c.innerHTML=`<div class="poslbl">${S.cardIdx===0?"BEFORE WE START":"HALFWAY THERE"}</div><button class="gbtn p" onclick="dealCards()">Select management card <span class="ar">▶</span></button>`;
  }else if(S.stage==="ready"){
    c.innerHTML=`<div class="poslbl">CARD LOCKED IN</div><button class="gbtn p" onclick="nextPos()">${S.step===0?"Start":"Continue"} <span class="ar">▶</span></button>`;
  }else if(S.stage==="pos"){
    const si=ORDER[S.step],cur=S.c.xi[si],sv=saleVal(cur);
    c.innerHTML=`<div class="poslbl">POSITION ${S.step+1} OF 11</div><div class="posname">${SLOTS[si].name}</div>
      <div class="pcard"><div class="o">${cur.ovr}</div><div class="i"><b>${cur.name}</b><small>Current starter</small></div><div class="v">£${sv}M</div></div>
      <div class="kbtns"><button class="gbtn k" onclick="keepPlayer()">Keep</button><button class="gbtn r" onclick="sellPlayer()">Sell +£${sv}M</button></div>`;
  }else if(S.stage==="replace"){
    const si=ORDER[S.step],opts=S.opts,bench=S.c.bench[si];
    c.innerHTML=`<div class="poslbl">REPLACE YOUR</div><div class="posname" style="font-size:44px">${SLOTS[si].name}</div>
      <div class="opts">${opts.map((p,i)=>{const pr=price(p),ok=pr<=S.budget;return `<div class="opt ${ok?"":"no"}" ${ok?`onclick="sign(${i})"`:""}>
        <div class="optrow"><div class="o">${p.ovr}</div><div class="i"><small>${["BUDGET","MID","TOP"][i]} OPTION${p.pot-p.ovr>=5?` · <span class="potbadge">POT ${p.pot}</span>`:""}</small><b>${p.name}</b><span>${p.club} · ${p.league}</span></div><div class="p">£${pr}M</div></div>
        <button class="statsToggle" onclick="event.stopPropagation();toggleStats(${i})">Stats ▾</button>
        <div class="stats" id="stats${i}">Age ${p.age} · ${p.apps} apps · ${p.goals}G ${p.assists}A last season · Potential ${p.pot} · ${p.ucl?"Champions League experience":"No Champions League experience"}</div>
      </div>`}).join("")}
        <button class="opt bench" onclick="useBench()"><div class="optrow"><div class="o">${bench.ovr}</div><div class="i"><small>FROM THE BENCH</small><b>${bench.name}</b><span>${S.c.club}</span></div><div class="p">FREE</div></div></button>
      </div>`;
  }else if(S.stage==="done"){
    c.innerHTML=`<div class="poslbl">XI COMPLETE</div><button class="gbtn p" onclick="finish()">See rating <span class="ar">▶</span></button>`;
  }
}

/* ---------- CARDS ---------- */
function dealCards(){
  const r=seeded(S.key+"cards"+S.cardIdx);
  const opts=shuffleR(MGMT.filter(c=>!S.usedCards.includes(c.t)),r).slice(0,4);
  S.deal=opts;
  $("tableKick").textContent=`MANAGEMENT CARD ${S.cardIdx+1} OF ${CARD_AT.length}`;
  $("tableTitle").textContent="Pick a card";
  $("deck").innerHTML=opts.map((c,i)=>{
    const kind=c.goal?"goal":(c.amt<0?"neg":"pos");
    const amtHtml=c.amt?`<div class="camt ${c.amt<0?"neg":"pos"}">${c.amt<0?"−":"+"}£${Math.abs(c.amt)}M</div>`:"";
    return `<div class="fc" id="fc${i}"><div class="fc-in" onclick="chooseCard(${i})">
     <div class="face back"><div class="em">XI</div><div class="tag">MANAGEMENT</div></div>
     <div class="face front ${kind}"><div class="type">${c.tag}</div>${amtHtml}<h3>${c.t}</h3><p>${c.d}</p></div></div></div>`;
  }).join("");
  $("tableBtn").style.visibility="hidden";
  $("table").classList.add("on");
  // start every card stacked in the top-left corner, then deal them into place
  opts.forEach((_,i)=>{
    const el=$("fc"+i),b=el.getBoundingClientRect();
    el.style.transition="none";
    el.style.transform=`translate(${24-b.left}px,${24-b.top}px) rotate(${-6+i*2}deg)`;
  });
  void document.body.offsetHeight; // commit the stacked position before animating
  opts.forEach((_,i)=>{
    const el=$("fc"+i);
    el.style.transition=`transform .75s cubic-bezier(.2,.9,.25,1.05) ${.25+i*.12}s`;
    el.style.transform="none";
    el.classList.add("ready");
  });
}
function chooseCard(i){
  if(S.stage==="ready"&&$("table").classList.contains("on")&&$("fc"+i).classList.contains("chosen"))return closeTable();
  if(S.stage!=="needCard")return;
  S.deal.forEach((_,j)=>{const e=$("fc"+j);e.style.transition="none";e.style.transform="none"}); // snap into place if still dealing
  const c=S.deal[i];S.card=c;S.usedCards.push(c.t);S.stage="ready";S.cardIdx++;
  S.goalCount=0;S.goalLeagues=new Set();S.goalDone=false;
  $("fc"+i).classList.add("flipped","chosen");
  $("tableTitle").textContent=c.t;
  setTimeout(()=>S.deal.forEach((_,j)=>{if(j!==i)$("fc"+j).classList.add("flipped","dim")}),700);
  setTimeout(()=>$("tableBtn").style.visibility="visible",1100);
  if(c.amt)setTimeout(()=>setBudget(S.budget+c.amt),900);
}
function closeTable(){$("table").classList.remove("on");$("deck").innerHTML="";renderPanel()}

/* ---------- POSITIONS ---------- */
const saleVal=p=>Math.round(p.val*(S.card&&S.card.sale||1));
const price=p=>Math.round(p.val*(S.card&&S.card.price||1));
function nextPos(){S.stage="pos";renderPanel()}
function keepPlayer(){
  const si=ORDER[S.step];S.team[si]={...S.c.xi[si],kind:"orig"};advance();
}
function sellPlayer(){
  const si=ORDER[S.step],cur=S.c.xi[si];
  setBudget(S.budget+saleVal(cur));
  S.opts=makeOptions(si);S.stage="replace";renderPanel();
}
function makeOptions(si){
  const r=seeded(S.key+"pos"+si+(S.card?S.card.t:""));
  const taken=new Set(S.team.filter(Boolean).map(p=>p.name));
  const pool=P.filter(p=>p.pos===SLOTS[si].pos&&p.club!==S.c.club&&!taken.has(p.name));
  const sorted=[...pool].sort((a,b)=>a.val-b.val),n=sorted.length,third=Math.max(1,Math.floor(n/3));
  const tiers=[sorted.slice(0,third),sorted.slice(third,n-third),sorted.slice(n-third)].map(t=>t.length?t:sorted);
  const out=[];tiers.forEach(t=>{const c=t.filter(p=>!out.includes(p));out.push(pickR(c.length?c:t,r))});
  return out;
}
function toggleStats(i){$("stats"+i).classList.toggle("open")}
function goalLabel(g){
  if(g.type==="nation")return `${S.goalCount}/${g.need} ${g.val} signings`;
  if(g.type==="ucl")return `${S.goalCount}/${g.need} Champions League signings`;
  if(g.type==="ageMin")return `${S.goalCount}/${g.need} signings aged ${g.val}+`;
  if(g.type==="ageMax")return `${S.goalCount}/${g.need} signings aged ${g.val} or under`;
  if(g.type==="leagueSpread")return `${S.goalCount}/${g.need} different leagues signed from`;
  if(g.type==="potentialGap")return `${S.goalCount}/${g.need} high-potential signings`;
  if(g.type==="posCount")return `${S.goalCount}/${g.need} ${({DEF:"defender",MID:"midfielder",FWD:"forward"})[g.val]} signings`;
  if(g.type==="priceMin")return `${S.goalCount}/${g.need} signings worth £${g.val}M+`;
  return "";
}
function checkGoal(p,pr){
  const card=S.card;if(!card||!card.goal||S.goalDone)return;
  const g=card.goal;
  if(g.type==="leagueSpread"){S.goalLeagues.add(p.league);S.goalCount=S.goalLeagues.size}
  else{
    const hit=g.type==="nation"?p.nation===g.val
      :g.type==="ucl"?p.ucl
      :g.type==="ageMin"?p.age>=g.val
      :g.type==="ageMax"?p.age<=g.val
      :g.type==="potentialGap"?(p.pot-p.ovr)>=g.val
      :g.type==="posCount"?p.pos===g.val
      :g.type==="priceMin"?pr>=g.val
      :false;
    if(hit)S.goalCount++;
  }
  if(S.goalCount>=g.need){S.goalDone=true;setBudget(S.budget+15)}
}
function sign(i){const p=S.opts[i],si=ORDER[S.step],pr=price(p);setBudget(S.budget-pr);S.team[si]={...p,kind:"new"};checkGoal(p,pr);advance()}
function useBench(){const si=ORDER[S.step];S.team[si]={...S.c.bench[si],kind:"bench"};advance()}
function advance(){
  renderPitch();S.step++;
  if(S.step>=ORDER.length){S.stage="done";return renderPanel()}
  if(CARD_AT.includes(S.step)){S.card=null;S.stage="needCard"}else S.stage="pos";
  renderPanel();
}

/* ---------- END ---------- */
function finish(){
  const avg=S.team.reduce((a,p)=>a+p.ovr,0)/11;
  const o=Math.round(avg*.9+S.mgr.ovr*.1);
  const orig=Math.round(S.c.xi.reduce((a,p)=>a+p.ovr,0)/11*.9+S.c.manager.ovr*.1);
  const d=store.get();d[S.key]=Math.max(d[S.key]||0,o);store.set(d);
  $("endOvr").textContent=o;
  $("grade").textContent=o>=89?"Ballon d'Or squad":o>=87?"Champions League winners":o>=85?"Title contenders":o>=83?"Top four":"Rebuild the rebuild";
  $("cmp").innerHTML=`Original ${S.c.club} <b>${orig}</b> · Yours <b>${o}</b> (${o-orig>=0?"+":""}${o-orig}) · <b>£${S.budget}M</b> left`;
  $("endOv").classList.add("on");
}
</script>
</body>
</html>
